<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ridge Lens</title>
    <meta name="theme-color" content="#7aa6d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b12" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Sichtbare Bergketten und Gipfelnamen aus Standort und Handy-Ausrichtung" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="./icons/icon.svg" alt="" width="112" height="112" />
      <div class="splash-name">Ridge Lens</div>
    </div>
    <main id="stage">
      <video id="camera" playsinline muted autoplay aria-hidden="true"></video>
      <canvas id="view" data-i18n-aria="aria.view"></canvas>
      <canvas id="overview" data-i18n-aria="aria.overview"></canvas>

      <div id="status" class="pill" role="status" aria-live="polite"></div>

      <div id="align" class="toast" hidden>
        <span id="align-text"></span>
        <button type="button" id="align-apply" class="primary"></button>
        <button type="button" id="align-close" class="icon-btn small" data-i18n-aria="aria.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <div id="update" class="toast" hidden>
        <span data-i18n="update.available"></span>
        <button type="button" id="update-reload" class="primary" data-i18n="update.reload"></button>
      </div>

      <div id="sensor-info" class="readout" hidden><span id="sensor-text"></span></div>

      <div id="target" class="readout target" hidden>
        <span id="target-text"></span>
        <button type="button" id="target-close" class="icon-btn small" data-i18n-aria="aria.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>

      <section id="search" class="search" hidden data-i18n-aria="aria.search">
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L20 20" /></svg>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" data-i18n-placeholder="search.placeholder" />
          <button type="button" id="search-close" class="icon-btn small" data-i18n-aria="aria.close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <ul id="search-results" role="listbox"></ul>
      </section>

      <nav class="dock" data-i18n-aria="aria.controls">
        <button type="button" id="menu" class="icon-btn" data-i18n-aria="aria.settings" aria-expanded="false" aria-controls="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
        </button>
        <button type="button" id="search-open" class="icon-btn" data-i18n-aria="aria.search" aria-expanded="false" aria-controls="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L20 20" /></svg>
        </button>
        <button type="button" id="camera-toggle" class="icon-btn" data-i18n-aria="aria.camera" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
        </button>
        <button type="button" id="gps" class="icon-btn" data-i18n-aria="aria.locate">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" class="fill" /><circle cx="12" cy="12" r="7.5" /><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22" /></svg>
        </button>
      </nav>

      <section id="panel" class="sheet" hidden data-i18n-aria="aria.settings">
        <div class="sheet-head">
          <h2 data-i18n="settings.title"></h2>
          <button type="button" id="panel-close" class="icon-btn small" data-i18n-aria="aria.close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <h3 class="group" data-i18n="settings.groupPlace"></h3>
        <form id="form">
          <label class="wide"><span data-i18n="settings.place"></span>
            <select id="preset">
              <option value="" data-i18n="settings.ownPlace"></option>
            </select>
          </label>
          <details class="wide more" id="manual">
            <summary data-i18n="settings.manual"></summary>
            <div class="grid">
              <label><span data-i18n="settings.lat"></span> <input id="lat" type="number" step="any" inputmode="decimal" required /></label>
              <label><span data-i18n="settings.lon"></span> <input id="lon" type="number" step="any" inputmode="decimal" required /></label>
              <label><span data-i18n="settings.ele"></span> <input id="ele" type="number" step="any" inputmode="numeric" data-i18n-placeholder="auto" /></label>
              <label><span data-i18n="settings.radius"></span> <input id="radius" type="number" min="10" max="250" step="10" inputmode="numeric" value="100" /></label>
            </div>
          </details>
          <label class="check wide"><input id="hidden" type="checkbox" /> <span data-i18n="settings.hidden"></span></label>
          <button type="submit" class="primary wide" data-i18n="settings.compute"></button>
        </form>

        <h3 class="group" data-i18n="settings.groupCamera"></h3>
        <label class="check" id="auto-align-row"><input id="auto-align" type="checkbox" checked /> <span data-i18n="settings.autoAlign"></span></label>
        <label class="lang" hidden><span data-i18n="settings.camera"></span><select id="camera-select"></select></label>
        <label class="check" id="manual-cal-row"><input id="manual-cal" type="checkbox" /> <span data-i18n="settings.manualCal"></span></label>
        <div id="manual-tools" hidden>
          <p class="help" data-i18n="settings.help"></p>
          <div class="row" id="camera-fov-row" hidden>
            <span class="help" id="camera-fov"></span>
            <button type="button" id="camera-fov-reset" data-i18n="settings.resetCameraFov"></button>
          </div>
          <div class="row">
            <button type="button" id="offset-reset" data-i18n="settings.resetOffset"></button>
          </div>
        </div>
        <details class="more">
          <summary data-i18n="settings.details"></summary>
          <p class="help" id="declination" hidden></p>
          <p class="help" id="sensor-noise" hidden></p>
          <p class="help" id="corr-log"></p>
        </details>

        <h3 class="group" data-i18n="settings.groupDisplay"></h3>
        <label class="lang"><span data-i18n="settings.language"></span>
          <select id="lang">
            <option value="auto" data-i18n="settings.langAuto"></option>
            <option value="de">Deutsch</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
          </select>
        </label>
        <label class="lang"><span data-i18n="sky.time"></span>
          <span class="time-row"><input id="sky-time" type="datetime-local" /><button type="button" id="sky-now" data-i18n="sky.now"></button></span>
        </label>
        <p class="help" id="sky-info" hidden></p>
        <div class="row">
          <button type="button" id="install" hidden data-i18n="settings.install"></button>
        </div>
        <p class="credits">
          <span data-i18n="credits.elevation"></span>: <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank" rel="noopener">AWS Terrain Tiles</a> ·
          <span data-i18n="credits.peaks"></span>: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" data-i18n="credits.osm"></a>, <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a> ·
          <span data-i18n="credits.stars"></span>: <a href="https://github.com/ofrohn/d3-celestial" target="_blank" rel="noopener">d3-celestial</a> (XHIP, IAU)<br />
          © 2026 Ridge Lens · <a href="https://github.com/jibes/ridge-lens" target="_blank" rel="noopener" data-i18n="credits.source"></a> ·
          <a href="https://github.com/jibes/ridge-lens/blob/main/LICENSE" target="_blank" rel="noopener"><span data-i18n="credits.license"></span>: GPL-3.0</a>
        </p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
