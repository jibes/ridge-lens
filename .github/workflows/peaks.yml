name: Build peak dataset

# Gipfel-Datensatz weltweit unabhängig vom Deploy erzeugen: benannte Gipfel aus der
# OSM-Weltdatei (monatlich, mit osmium als Datenstrom gefiltert), Bekanntheit via Wikidata
# (fehlende Werte je Lauf im Zeitbudget). Der Stand liegt auf dem Branch peaks-data (ein
# einzelner Commit, Historie wächst nicht).
on:
  schedule:
    # alle 4 Stunden; ohne fällige Blöcke endet ein Lauf nach Sekunden ohne Veröffentlichung
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      osm:
        description: OSM-Auszug neu erzeugen (sonst nur monatlich)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scripts/build-peaks.mjs
      - scripts/build-sats.mjs
      - scripts/restore-peaks.sh
      - .github/workflows/peaks.yml

permissions:
  contents: write

concurrency:
  group: peaks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Objektarten aus der Weltdatei (osmium tags-filter); Änderung löst neuen Auszug aus
      PEAKS_OSM_FILTER: n/natural=peak,volcano
      # Verarbeitung des Auszugs geändert (z. B. Doppeleinträge zusammenführen): hochzählen
      PEAKS_EXTRACT_REV: '2'
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore dataset
        run: |
          scripts/restore-peaks.sh public/peaks
          # Prüfsummen relativ zum Datensatz (der Veröffentlichungsschritt läuft darin)
          (cd public/peaks && sha1sum index.json $(ls sats.json 2>/dev/null)) > "$RUNNER_TEMP/index.sha" 2>/dev/null || true
      - name: Decide OSM refresh
        id: osm
        shell: bash
        run: |
          cov=$(jq -r '.coverage // empty' public/peaks/index.json 2>/dev/null || true)
          osm=$(jq -r '.osm // empty' public/peaks/meta.json 2>/dev/null || true)
          # Geänderter Filter (z. B. neue Objektart) verlangt einen neuen Auszug
          filter=$(jq -r '.filter // empty' public/peaks/meta.json 2>/dev/null || true)
          rev=$(jq -r '.rev // empty' public/peaks/meta.json 2>/dev/null || true)
          age=999
          [ -n "$osm" ] && age=$(( ($(date +%s) - $(date -d "$osm" +%s)) / 86400 ))
          echo "Datensatz: ${cov:-regional}, OSM-Stand ${osm:-keiner} (${age} Tage), Filter ${filter:-unbekannt}"
          if [ "$cov" != global ] || [ "$age" -ge 30 ] || [ "$filter" != "$PEAKS_OSM_FILTER" ] || [ "$rev" != "$PEAKS_EXTRACT_REV" ] || [ "${{ inputs.osm }}" = true ]; then
            echo refresh=true >> "$GITHUB_OUTPUT"
          fi
      - name: Extract peaks from OSM planet
        if: steps.osm.outputs.refresh == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          osmium --version | head -1
          # Erste erreichbare Quelle der Weltdatei (OSM-Spiegel bei AWS, Uni-Spiegel, OSMF)
          url=
          for u in \
            https://osm-planet-us-west-2.s3.amazonaws.com/planet/pbf/planet-latest.osm.pbf \
            https://osm-planet-eu-central-1.s3.amazonaws.com/planet/pbf/planet-latest.osm.pbf \
            https://ftp.fau.de/osm-planet/pbf/planet-latest.osm.pbf \
            https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf/planet-latest.osm.pbf \
            https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf; do
            if curl -sfIL --max-time 30 -A 'ridge-lens-build (github.com/jibes/ridge-lens)' "$u" -o /dev/null; then url=$u; break; fi
            echo "nicht erreichbar: $u"
          done
          [ -n "$url" ] || { echo "Keine Quelle der OSM-Weltdatei erreichbar"; exit 1; }
          echo "Quelle: $url"
          # Als Datenstrom filtern (die ~80 GB werden nie gespeichert); nur Knoten, ohne Referenzen
          start=$(date +%s)
          curl -sfL --retry 3 -A 'ridge-lens-build (github.com/jibes/ridge-lens)' "$url" \
            | osmium tags-filter -F pbf -R - "$PEAKS_OSM_FILTER" -o "$RUNNER_TEMP/peaks.osm.pbf"
          echo "Gefiltert in $(( ($(date +%s) - start) / 60 )) min: $(du -h "$RUNNER_TEMP/peaks.osm.pbf" | cut -f1)"
          osmium export "$RUNNER_TEMP/peaks.osm.pbf" -f geojsonseq --add-unique-id=type_id -o "$RUNNER_TEMP/peaks.geojsonseq"
          echo "PEAKS_OSM_GEOJSONSEQ=$RUNNER_TEMP/peaks.geojsonseq" >> "$GITHUB_ENV"
      - name: Fetch peaks and fame
        env:
          PEAKS_BUDGET_MIN: 45
        run: node scripts/build-peaks.mjs
      - name: Fetch satellite elements
        # Bahnelemente (CelesTrak): hellste Satelliten plus ISS, Tiangong, Hubble; höchstens
        # alle 12 h (CelesTrak bittet um sparsame Abrufe). Fehlschlag: alte Datei bleibt.
        continue-on-error: true
        shell: bash
        run: |
          gen=$(jq -r '.generated // empty' public/peaks/sats.json 2>/dev/null || true)
          if [ -n "$gen" ] && [ $(( $(date +%s) - $(date -d "$gen" +%s) )) -lt 43200 ]; then
            echo "Satelliten vom $gen – noch aktuell"; exit 0
          fi
          ua='ridge-lens-build (github.com/jibes/ridge-lens)'
          base=https://celestrak.org/NORAD/elements/gp.php
          curl -sf --retry 2 -A "$ua" "$base?GROUP=visual&FORMAT=tle" -o "$RUNNER_TEMP/visual.tle"
          for id in 25544 48274 20580; do
            curl -sf --retry 2 -A "$ua" "$base?CATNR=$id&FORMAT=tle" >> "$RUNNER_TEMP/major.tle" || true
          done
          node scripts/build-sats.mjs "$RUNNER_TEMP/major.tle" "$RUNNER_TEMP/visual.tle"
      - name: Publish to branch peaks-data
        working-directory: public/peaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Unverändert: gleicher Index, gleiche bzw. weiterhin keine Satellitendatei
          if [ -z "${PEAKS_BOOTSTRAPPED:-}" ] && sha1sum -c --status "$RUNNER_TEMP/index.sha" 2>/dev/null \
            && { [ ! -f sats.json ] || grep -q ' sats.json$' "$RUNNER_TEMP/index.sha"; }; then
            echo "Keine Änderungen"; exit 0
          fi
          git init -q
          git checkout -q -b peaks-data
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Gipfel-Datensatz $(date -u +%FT%RZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" peaks-data
          echo "Veröffentlicht: $(jq '.tiles | length' index.json) Kacheln"
