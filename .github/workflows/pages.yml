name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-d1ee0c67-s1pl8d]
  workflow_dispatch:
  # Gipfel-Datensatz wöchentlich auffrischen (Montag früh)
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Gipfel-Datensatz (OSM via Overpass): Stand des letzten Laufs wiederherstellen,
      # fehlende/veraltete Blöcke im Zeitbudget nachladen, neuen Stand unter neuem Schlüssel sichern
      - uses: actions/cache@v4
        with:
          path: public/peaks
          key: peaks-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: peaks-v2-
      - name: Build peak dataset
        # Ohne (vollständigen) Datensatz fällt die App auf Live-Overpass zurück
        continue-on-error: true
        timeout-minutes: 25
        env:
          PEAKS_BUDGET_MIN: 20
        run: node scripts/build-peaks.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
