name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-d1ee0c67-s1pl8d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Gipfel-Datensatz (OSM via Overpass) wöchentlich neu, sonst aus dem Cache
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: peaks-cache
        uses: actions/cache@v4
        with:
          path: public/peaks
          key: peaks-${{ hashFiles('scripts/build-peaks.mjs') }}-${{ steps.week.outputs.week }}
      - name: Build peak dataset
        if: steps.peaks-cache.outputs.cache-hit != 'true'
        # Ohne Datensatz fällt die App auf Live-Overpass zurück
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/build-peaks.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
