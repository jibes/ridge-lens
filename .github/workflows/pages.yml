name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-d1ee0c67-s1pl8d]
  workflow_dispatch:
  # Nach jedem Lauf des Gipfel-Datensatzes neu veröffentlichen
  workflow_run:
    workflows: [Build peak dataset]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Gipfel-Datensatz kommt fertig vom Branch peaks-data (siehe peaks.yml)
      - run: scripts/restore-peaks.sh public/peaks
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
